<!DOCTYPE html>
<html>

<head>
<title>Login - Voxia</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body class="auth">

<div class="auth-card">

<h1 class="logo">Voxia</h1>
<p class="tagline">Welcome back</p>

{% if error %}
<p class="error-msg">{{ error }}</p>
{% endif %}

<form method="POST" action="{{ url_for('login') }}" onsubmit="disableBtn()">

<div class="input-group">
<input type="email" name="email" required>
<label>Email</label>
</div>

<div class="input-group password-group">
<input type="password" name="password" id="password" required>
<label>Password</label>

<span class="toggle-password" onclick="togglePassword()">👁</span>
</div>

<button type="submit" id="loginBtn">Login</button>

</form>

<p class="switch">
Don't have an account?
<a href="{{ url_for('signup') }}">Signup</a>
</p>

<p class="switch">
<a href="{{ url_for('home') }}">← Back to Home</a>
</p>

</div>

<script>
function togglePassword(){
let pass = document.getElementById("password")
pass.type = pass.type === "password" ? "text" : "password"
}

// prevent double click issue
function disableBtn(){
document.getElementById("loginBtn").innerText = "Logging in..."
}
</script>

</body>
<script>
document.querySelector("form").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && document.activeElement.tagName !== "BUTTON") {
        e.preventDefault();
    }
});
</script>
</html>
